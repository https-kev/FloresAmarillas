<title>Para ti mi amor</title>
<style>
  :root {
    --sky-top: #fff6e5;
    --sky-bottom: #ffe9d6;
    --text-color: #5a3d2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, var(--sky-top), var(--sky-bottom));
    font-family: Georgia, 'Times New Roman', serif;
    overflow-x: hidden;
  }
  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px);
    position: relative;
  }
  .bouquet-wrap {
    width: min(88vw, 420px);
  }
  .bouquet-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 18px 24px rgba(90, 61, 43, 0.18));
    animation: sway 5s ease-in-out infinite;
    transform-origin: 50% 95%;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.2deg); }
  }

  .bloom-group {
    opacity: 0;
    transform: scale(0.2);
    transform-box: fill-box;
    transform-origin: center;
    animation: bloom 0.9s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  @keyframes bloom {
    0%   { opacity: 0; transform: scale(0.15) rotate(-8deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .message {
    margin-top: 24px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1.4s ease forwards;
    animation-delay: 2.8s;
    max-width: 380px;
  }
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .message h1 {
    font-size: clamp(20px, 5.5vw, 30px);
    color: var(--text-color);
    margin: 0 0 6px;
    font-weight: normal;
    letter-spacing: 0.5px;
  }
  .message p {
    font-size: clamp(13px, 3.6vw, 15px);
    color: #8a6a52;
    margin: 0;
    line-height: 1.5;
  }

  .petal-fall {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 10px;
    border-radius: 50% 0 50% 0;
    pointer-events: none;
    opacity: 0.85;
    z-index: 5;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(400deg); opacity: 0; }
  }

  @media (max-width: 360px) {
    .stage { padding-left: 10px; padding-right: 10px; }
    .bouquet-wrap { width: 94vw; }
    .message { margin-top: 16px; }
  }

  @media (max-height: 620px) {
    .stage { justify-content: flex-start; padding-top: 20px; }
    .bouquet-wrap { width: min(80vw, 340px); }
  }
</style>

<script>
  const colors = ['#ffd93d', '#ffcf3f', '#f5b301', '#ffe45c'];
  function fallingPetal() {
    const p = document.createElement('div');
    p.className = 'petal-fall';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    const duration = 4 + Math.random() * 3;
    p.style.animation = `fall ${duration}s linear forwards`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), duration * 1000 + 200);
  }
  setInterval(fallingPetal, 700);
</script>
